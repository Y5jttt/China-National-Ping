<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SmartPing Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="assets/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/bootstrap-responsive.min.css" rel="stylesheet">
<link href="assets/css/font-awesome.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
<link href="assets/css/pages/dashboard.css" rel="stylesheet">
<!-- Le HTML5 shim, for IE6-8 support of HTML5 elements -->
<!--[if lt IE 9]>
      <script src="http://html5shim.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->
</head>
<body>
<div class="navbar navbar-fixed-top">
  <div class="navbar-inner">
    <div class="container">
      <span id="cloudbrand" class="brand" style="margin-right: -15px;"></span><span class="brand">SmartPing 全国延迟监控<span id="agentname"></span></span>
      <span id="banner_last_ck_time" class="pull-right " style="margin-top: 10px;"></span>
    </div>
  </div>
</div>
<div class="subnavbar">
  <div class="subnavbar-inner">
    <div class="container">
      <ul class="mainnav">
        <li class="active"><a href="index.html"><i class="icon-map-marker"></i><span>全国延迟</span> </a> </li>
      </ul>
    </div>
  </div>
</div>
<div class="main" style="margin-top:-20px;">
  <div class="main-inner">
    <div class="container">
      <div class="row">
        <div class="span10">
          <div style="margin-bottom:10px;">
            <div class="btn-group" data-toggle="buttons-radio">
              <button class="btn btn-small active" id="view-all" onclick="setViewMode('all')">全部</button>
              <button class="btn btn-small" id="view-ctcc" onclick="setViewMode('ctcc')">电信</button>
              <button class="btn btn-small" id="view-cucc" onclick="setViewMode('cucc')">联通</button>
              <button class="btn btn-small" id="view-cmcc" onclick="setViewMode('cmcc')">移动</button>
              <button class="btn btn-small" id="view-best" onclick="setViewMode('best')">最优</button>
            </div>
            <button class="btn btn-small btn-primary" onclick="refreshData()" style="margin-left:10px;"><i class="icon-refresh"></i> 刷新</button>
            <span id="lastUpdate" style="margin-left:15px;color:#666;"></span>
          </div>
          <div id="echarts-map" style="width: 100%;"></div>
          <div id="provinceChart" style="width: 100%; margin-top:10px; display:none;">
            <div class="widget">
              <div class="widget-header">
                <i class="icon-bar-chart"></i>
                <h3 id="provinceChartTitle">省份延迟曲线</h3>
                <div style="float:right;margin:5px;">
                  <select id="timeRangeSelect" onchange="changeTimeRange()" style="margin-right:10px;">
                    <option value="1">最近1小时</option>
                    <option value="6">最近6小时</option>
                    <option value="12">最近12小时</option>
                    <option value="24" selected>最近24小时</option>
                    <option value="72">最近3天</option>
                    <option value="168">最近7天</option>
                  </select>
                  <button class="btn btn-small" onclick="closeProvinceChart()">关闭</button>
                </div>
              </div>
              <div class="widget-content">
                <div id="echarts-province" style="min-height:200px;"></div>
              </div>
            </div>
          </div>
          <input type="hidden" id="agent" value="">
        </div>
        <div class="span2">
          <div class="widget widget-table action-table">
            <div class="widget-header"> <i class="icon-th-list"></i>
              <h3>省份排名</h3>
            </div>
            <div class="widget-content">
              <table class="table table-striped table-bordered">
                <thead>
                  <tr><th>省份</th><th>延迟</th></tr>
                </thead>
                <tbody class="rankinglist" id="rankinglist">
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  <div class="footer-inner">
    <div class="container">
      <div class="row">
        <div class="span12"> &copy; 2017 - 2020 <a target="_blank" href="http://smartping.org" >SmartPing.org</a> <span style="float:right" id="verion"></span></div>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/jquery-1.7.2.min.js"></script>
<script src="assets/js/bootstrap.js"></script>
<script src="assets/js/echarts-all.js.5.5.0"></script>
<script language="JavaScript" type="text/javascript" src="assets/js/My97DatePicker/WdatePicker.js"></script>
<script src="assets/js/funcs.js"></script>
<script>
    var mapDetailData = {};
    var mapDelayData = {};
    var viewMode = 'all';
    var mainChart = null;
    var provinceChart = null;
    var currentProvince = null;

    var telNames = {'ctcc': '电信', 'cucc': '联通', 'cmcc': '移动'};
    var telecomNames = {'电信': 'ctcc', '联通': 'cucc', '移动': 'cmcc'};

    function formatDelay(delay) {
        if (delay >= 2000 || delay <= 0) {
            return '<span style="color:#E31F16">超时</span>';
        }
        return delay.toFixed(0) + 'ms';
    }

    function buildTooltipContent(province) {
        // Normalize province name for lookup
        var normalizedProv = province.replace(/省|市|自治区|回族|壮族|维吾尔/g, '');
        var detail = mapDetailData[normalizedProv] || mapDetailData[province];
        var delayInfo = mapDelayData[normalizedProv] || mapDelayData[province];
        if (!detail) {
            return '<div style="font-size:12px;padding:5px;">正在加载 ' + province + ' 数据...</div>';
        }

        var html = '<div style="font-size:12px;line-height:1.6;min-width:200px;">';
        html += '<b>' + province + '</b><br/>';

        var delays = [];
        for (var tel in telNames) {
            var cities = detail[tel];
            if (cities) {
                for (var city in cities) {
                    var ips = cities[city];
                    if (ips && ips.length > 0) {
                        var cityName = city || telNames[tel];
                        for (var i = 0; i < ips.length; i++) {
                            var ip = ips[i];
                            var delayVal = ip.delay >= 2000 ? '超时' : ip.delay.toFixed(0) + 'ms';
                            html += '<div style="margin-left:5px;">[' + telNames[tel] + ']' + cityName + ': ' + formatDelay(ip.delay) + ' (丢包' + ip.loss + '%)</div>';
                        }
                    }
                }
            }
        }

        // Show best delay if available
        if (delayInfo && delayInfo.best) {
            html += '<div style="margin-top:5px;border-top:1px solid #ccc;padding-top:5px;">';
            html += '<b>最优: ' + telNames[delayInfo.bestTel] + ' ' + formatDelay(delayInfo.best) + '</b>';
            html += '</div>';
        }

        html += '<div style="color:#666;font-size:10px;margin-top:5px;">点击查看历史曲线</div>';
        html += '</div>';
        return html;
    }

    function getDelayColor(delay) {
        if (delay <= 0 || delay >= 2000) return '#E31F16';
        if (delay <= 50) return '#27AB22';
        if (delay <= 100) return '#45DE43';
        if (delay <= 200) return '#BDF766';
        if (delay <= 250) return '#F3EE4A';
        return '#F39A38';
    }

    function getBestDelayForProvince(province) {
        var normalizedProv = province.replace(/省|市|自治区|回族|壮族|维吾尔/g, '');
        var detail = mapDetailData[normalizedProv] || mapDetailData[province];
        if (!detail) return null;

        var best = null;
        var bestTel = null;
        for (var tel in telNames) {
            var cities = detail[tel];
            if (cities) {
                for (var city in cities) {
                    var ips = cities[city];
                    if (ips) {
                        for (var i = 0; i < ips.length; i++) {
                            var d = ips[i].delay;
                            if (d < 1000 && (best === null || d < best)) {
                                best = d;
                                bestTel = tel;
                            }
                        }
                    }
                }
            }
        }
        return best ? {delay: best, tel: bestTel} : null;
    }

    function calculateBestDelays() {
        var provinceDelays = {};
        for (var prov in mapDetailData) {
            var best = getBestDelayForProvince(prov);
            if (best) {
                provinceDelays[prov] = {best: best.delay, bestTel: best.tel};
            }
        }
        return provinceDelays;
    }

    function createOption(result) {
        var series = [];
        var legendData = [];

        // Calculate best delay for each province (across all telcos)
        var bestDelayByProvince = {};
        var provinceBestTel = {};
        var telcoList = ['ctcc', 'cucc', 'cmcc'];
        var telcoNames = {'ctcc': '电信', 'cucc': '联通', 'cmcc': '移动'};

        // Initialize with best delays
        for (var tel in telcoList) {
            var data = result["avgdelay"][telcoList[tel]] || [];
            for (var i = 0; i < data.length; i++) {
                var prov = data[i].name;
                var val = data[i].value;
                if (val > 0 && val < 2000) {
                    if (bestDelayByProvince[prov] === undefined || val < bestDelayByProvince[prov]) {
                        bestDelayByProvince[prov] = val;
                        provinceBestTel[prov] = telcoList[tel];
                    }
                }
            }
        }

        // Create series data based on viewMode
        function getAreaColor(value) {
            if (value >= 2000 || value <= 0) return '#E31F16';
            if (value <= 50) return '#27AB22';
            if (value <= 100) return '#45DE43';
            if (value <= 200) return '#BDF766';
            if (value <= 250) return '#F3EE4A';
            return '#F39A38';
        }

        if (viewMode === 'all' || viewMode === 'best') {
            // Show best delay for each province
            var bestData = [];
            for (var prov in bestDelayByProvince) {
                var val = bestDelayByProvince[prov];
                bestData.push({
                    name: prov,
                    value: val,
                    itemStyle: {
                        areaColor: getAreaColor(val)
                    }
                });
            }
            series.push({
                name: '最优延迟',
                type: 'map',
                map: 'china',
                roam: false,
                label: {
                    show: false
                },
                tooltip: {
                    show: true,
                    trigger: 'item',
                    formatter: function(params) {
                        return buildTooltipContent(params.name);
                    }
                },
                symbol: 'circle',
                symbolSize: 0,
                showLegendSymbol: false,
                itemStyle: {
                    normal: {
                        borderColor: '#fff'
                    },
                    emphasis: {
                        areaColor: '#ddd',
                        label: { show: true }
                    }
                },
                data: bestData
            });
            legendData.push('最优延迟');
        } else {
            // Show specific telco
            var tel = viewMode;
            var telData = result["avgdelay"][tel] || [];
            var coloredData = telData.map(function(item) {
                return {
                    name: item.name,
                    value: item.value,
                    itemStyle: {
                        areaColor: getAreaColor(item.value)
                    }
                };
            });
            series.push({
                name: telcoNames[tel],
                type: 'map',
                map: 'china',
                roam: false,
                label: {
                    show: false
                },
                tooltip: {
                    show: true,
                    trigger: 'item',
                    formatter: function(params) {
                        return buildTooltipContent(params.name);
                    }
                },
                symbol: 'circle',
                symbolSize: 0,
                showLegendSymbol: false,
                itemStyle: {
                    normal: {
                        borderColor: '#fff'
                    },
                    emphasis: {
                        areaColor: '#ddd',
                        label: { show: true }
                    }
                },
                data: coloredData
            });
            legendData.push(telcoNames[tel]);
        }

        var minVal = 0, maxVal = 300;
        if (viewMode === 'best') {
            minVal = 0; maxVal = 100;
        }

        return {
            title : {
                text: result["text"],
                subtext: result["subtext"],
                x:'center'
            },
            tooltip : {
                trigger: 'item',
                position: function (point, params, dom, rect, size) {
                    const x = point[0];
                    const y = point[1];
                    const windowWidth = window.innerWidth;
                    const offset = 10;

                    if (x > windowWidth / 2) {
                        return [x - 220 - offset, y];
                    }
                    return [x + offset, y];
                },
                formatter: function(params) {
                    return buildTooltipContent(params.name);
                }
            },
            legend: {
                orient: 'vertical',
                x:'left',
                data: legendData,
                selectedMode: false,
                selected: {
                    '最优延迟': true,
                    '电信': viewMode === 'ctcc',
                    '联通': viewMode === 'cucc',
                    '移动': viewMode === 'cmcc'
                }
            },
            series : series
        };
    }

    function initChart(option) {
        var mainContainer = document.getElementById('echarts-map');
        var resizeMainContainer = function () {
            mainContainer.style.height = ($(window).height()-220)+"px";
        };
        resizeMainContainer();
        if (mainChart) {
            mainChart.dispose();
        }
        mainChart = echarts.init(mainContainer);

        // Load and register map data for ECharts 5
        $.ajax({
            url: 'assets/map/china.json',
            async: false,
            dataType: 'json',
            success: function(data) {
                // Normalize province names to remove suffix
                for (var i = 0; i < data.features.length; i++) {
                    var name = data.features[i].properties.name;
                    var normalized = name.replace(/省|市|自治区|回族|壮族|维吾尔/g, '');
                    data.features[i].properties.name = normalized;
                }
                echarts.registerMap('china', data);
            },
            error: function() {
                console.log('Failed to load map data');
            }
        });

        mainChart.setOption(option);

        mainChart.on('click', function(params) {
            if (params.name) {
                var rawName = params.name;
                var normalizedName = params.name.replace(/省|市|自治区|回族|壮族|维吾尔/g, '');
                if (mapDetailData[normalizedName]) {
                    showProvinceChart(normalizedName);
                } else if (mapDetailData[rawName]) {
                    showProvinceChart(rawName);
                } else if (mapDetailData[params.name]) {
                    showProvinceChart(params.name);
                } else {
                    for (var key in mapDetailData) {
                        if (key.indexOf(normalizedName) >= 0 || normalizedName.indexOf(key) >= 0) {
                            showProvinceChart(key);
                            return;
                        }
                    }
                    showProvinceChart(normalizedName);
                }
            }
        });
        $(window).on('resize',function(){
            resizeMainContainer();
            mainChart.resize();
        });
        return mainChart;
    }

    function updateRanking() {
        var ranking = [];
        for (var prov in mapDetailData) {
            var best = getBestDelayForProvince(prov);
            if (best) {
                ranking.push({province: prov, delay: best.delay, tel: best.tel});
            }
        }
        ranking.sort(function(a, b) { return a.delay - b.delay; });

        var html = '';
        for (var i = 0; i < Math.min(10, ranking.length); i++) {
            var item = ranking[i];
            html += '<tr onclick="showProvinceChart(\'' + item.province + '\')" style="cursor:pointer;">';
            html += '<td>' + item.province + '</td>';
            html += '<td><span style="color:' + getDelayColor(item.delay) + ';">' + formatDelay(item.delay) + '</span></td>';
            html += '</tr>';
        }
        document.getElementById('rankinglist').innerHTML = html;
    }

    function setViewMode(mode) {
        viewMode = mode;
        $('.btn-group .btn').removeClass('active');
        $('#view-' + mode).addClass('active');
        refreshData();
    }

    function showProvinceChart(province) {
        currentProvince = province;
        document.getElementById('provinceChartTitle').innerText = province + ' - 延迟曲线';
        document.getElementById('provinceChart').style.display = 'block';
        loadProvinceChart(province);
    }

    function changeTimeRange() {
        if (currentProvince) {
            loadProvinceChart(currentProvince);
        }
    }

    function loadProvinceChart(province) {
        var hours = document.getElementById('timeRangeSelect').value;
        $.getJSON('/api/province_history.json?province=' + encodeURIComponent(province) + '&hours=' + hours, function(result) {
            createProvinceChart(result);
        });
    }

    function closeProvinceChart() {
        document.getElementById('provinceChart').style.display = 'none';
        document.getElementById('echarts-province').innerHTML = '';
        provinceChart = null;
    }

    function createProvinceChart(data) {
        var container = document.getElementById('echarts-province');

        if (!data.ips || data.ips.length === 0) {
            container.innerHTML = '<div style="padding:50px;text-align:center;color:#999;">暂无数据</div>';
            return;
        }

        // Clear container
        container.innerHTML = '';

        var delayMax = 200;

        for (var i = 0; i < data.ips.length; i++) {
            var ip = data.ips[i];
            var name = (telNames[ip.telecom] || ip.telecom) + ' ' + ip.city + ' ' + ip.ip;

            if (!ip.history || !ip.history.length) continue;

            // Create wrapper div for this IP
            var wrapper = document.createElement('div');
            wrapper.style.cssText = 'margin-bottom:20px;padding:10px;background:#f5f5f5;border-radius:5px;';
            container.appendChild(wrapper);

            var title = document.createElement('div');
            title.style.cssText = 'font-weight:bold;margin-bottom:10px;';
            title.innerHTML = name + ' <span style="color:#666;font-weight:normal;">(点击查看详情)</span>';
            wrapper.appendChild(title);

            var chartDiv = document.createElement('div');
            chartDiv.style.cssText = 'width:100%;height:250px;background:#fff;';
            chartDiv.id = 'province-ip-chart-' + i;
            wrapper.appendChild(chartDiv);

            var timePoints = [];
            var delayValues = [];

            var count = ip.history.length;
            for (var t = 0; t < count; t++) {
                timePoints.push(ip.times && ip.times[t] ? ip.times[t].substring(11) : String(t));
            }
            for (var t = 0; t < ip.history.length; t++) {
                var v = ip.history[t];
                delayValues.push((v === null || v === undefined || v >= 2000) ? 0 : v);
            }

            var chartDom = document.getElementById('province-ip-chart-' + i);
            if (!chartDom) {
                console.error('Chart DOM not found:', 'province-ip-chart-' + i);
                continue;
            }
            chartDom.style.width = chartDom.offsetWidth + 'px';
            chartDom.style.height = '250px';

            var lossValues = [];
            for (var j = 0; j < ip.history.length; j++) {
                lossValues.push(ip.loss && ip.loss[j] !== undefined ? ip.loss[j] : 0);
            }

            var option = {
                tooltip: {
                    trigger: 'axis'
                },
                legend: {
                    data: ['延迟', '丢包']
                },
                xAxis: {
                    type: 'category',
                    data: timePoints
                },
                yAxis: [
                    { type: 'value', name: '延迟(ms)', min: 0 },
                    { type: 'value', name: '丢包(%)', min: 0, max: 100 }
                ],
                series: [
                    { name: '延迟', type: 'line', yAxisIndex: 0, data: delayValues },
                    { name: '丢包', type: 'line', yAxisIndex: 1, data: lossValues, lineStyle: { type: 'dashed' } }
                ]
            };

            var chart = echarts.init(chartDom);
            chart.setOption(option);
        }
    }

    function loadMapData(url) {
        $.getJSON(url + "/api/mapping.json", function(result) {
            mapDelayData = calculateBestDelays();
            mapDetailData = {};

            // Load detail data
            $.getJSON(url + "/api/mapping_detail.json", function(detailResult) {
                mapDetailData = detailResult;
                mapDelayData = calculateBestDelays();

                var option = createOption(result);
                initChart(option);
                updateRanking();

                var now = new Date();
                $('#lastUpdate').text('最后更新: ' + now.getHours() + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes());
            }).fail(function() {
                var option = createOption(result);
                initChart(option);
            });
        });
    }

    function refreshData() {
        loadMapData('');
    }

    $(function(){
        $("#echarts").height($(window).height()-220);
        $.getJSON("/api/config.json",function(result){
            $("#verion").html("Version: "+result["Ver"])
            loadMapData('');
            setInterval(refreshData, 60000);  // Auto refresh every 60s
        }).fail(function (xhr, status) {
            loadMapData('');
        });

    });
</script>
</body>
</html>
